# One-time bootstrap publish for crates.io — the crate must exist before
# a Trusted Publisher can be registered on it (crates.io has no pending
# publishers). Uses the CARGO_REGISTRY_TOKEN secret once; this workflow
# is removed immediately after the bootstrap publish lands, and the
# token is revoked by the owner. Future releases use publish-crate.yml
# (OIDC trusted publishing, keyless).
name: Publish bootstrap (one-time, crates.io)

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish stitch-substrate to crates.io
        working-directory: stitch-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
